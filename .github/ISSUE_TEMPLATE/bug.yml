name: Bug
description: Picket did something wrong or stopped where it should not.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Picket version
      description: The output of `picket --version`.
      placeholder: 1.0.0-alpha.6
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      description: The lane of the work item, when the bug happened inside one.
      options:
        - not in a work item
        - fast
        - order
        - design
        - research
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The request you typed or the command you ran.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The message or block Picket printed, copied as text. Remove any secret first.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: list
    attributes:
      label: Output of picket list
      description: Optional. It shows the work items and their next step.
      render: text
