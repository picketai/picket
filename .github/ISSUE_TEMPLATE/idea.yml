name: Idea
description: Something Picket could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where Picket got in the way or left you alone.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like to happen instead.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Optional. Your workaround, if you have one.
