name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      - name: Upgrade npm
        run: |
          npm install -g npm@11.21.0
          npm --version

      - name: Git identity for the tests
        run: |
          git config --global user.name release-bot
          git config --global user.email release-bot@users.noreply.github.com

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/
          retention-days: 1

  build-on-22:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Git identity for the tests
        run: |
          git config --global user.name release-bot
          git config --global user.email release-bot@users.noreply.github.com

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Test the build
        run: node --test "test/cli/**/*.test.mjs" "test/hooks/**/*.test.mjs"

  mods:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Test the mods
        run: node scripts/test.mjs mods

  publish:
    needs: [test, build-on-22]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.21.0
          npm --version

      - name: Install
        run: npm ci

      - name: Choose the dist-tag
        id: dist
        env:
          REF: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          tag=$(node .github/scripts/release.mjs dist-tag "$REF")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tagged commit is on trunk
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/trunk

      - name: Publish
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch'
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: npm publish --dry-run --access public --tag "$DIST_TAG"
