services:
  web:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    labels:
      io.github.picketai.role: dependency
    command: ["sh", "-c", "mkdir -p /www && echo ok > /www/login && httpd -f -p 8080 -h /www"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/login"]
      interval: 2s
      timeout: 2s
      retries: 15

  browser:
    image: mcr.microsoft.com/playwright:v1.50.0-noble@sha256:9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e
    labels:
      io.github.picketai.role: browser

x-picket:
  version: 1
