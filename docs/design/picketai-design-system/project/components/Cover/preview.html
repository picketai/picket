<div class="cover">
<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap");
.cover{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden}
.cover svg{position:absolute;left:480px;top:0;width:480px;height:288px}
.slab{fill:var(--accent)}
.deep{fill:var(--surface)}
.tint{fill:var(--accent-shimmer)}
.rail{fill:var(--row-highlight)}
.ok{fill:var(--success)}
.picket{fill:var(--text)}
.panel{rx:var(--radius-lg)}
.chip{rx:var(--radius-sm)}
.cover .text{position:absolute;left:48px;bottom:48px;max-width:420px;display:flex;flex-direction:column;gap:8px}
.cover .name{font-family:var(--font-mono);font-weight:700;font-size:84px;line-height:.92;color:var(--text)}
.cover .tag{font-family:var(--font-sans);font-size:14px;line-height:1.4;color:var(--inactive)}
</style>
<svg viewBox="0 0 480 288" aria-hidden="true">
<rect class="deep panel" x="24" y="24" width="168" height="240"></rect>
<rect class="slab" x="216" y="-12" width="216" height="300"></rect>
<rect class="tint chip" x="24" y="216" width="72" height="48"></rect>
<rect class="ok chip" x="120" y="240" width="48" height="24"></rect>
<rect class="rail" x="200" y="168" width="280" height="12"></rect>
<polygon class="picket" points="240,276 240,132 252,108 264,132 264,276"></polygon>
<polygon class="picket" points="288,276 288,132 300,108 312,132 312,276"></polygon>
<polygon class="picket" points="336,276 336,132 348,108 360,132 360,276"></polygon>
<polygon class="picket" points="384,276 384,132 396,108 408,132 408,276"></polygon>
</svg>
<div class="text">
<div class="name">PicketAI</div>
<div class="tag">Four lanes, four agents, one kernel.</div>
</div>
</div>
