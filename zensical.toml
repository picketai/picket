[project]
site_name = "Picket"
site_description = "A software-development workflow for Claude Code: four lanes, five agents, one kernel."
site_url = "https://picketai.github.io/picket/"
repo_url = "https://github.com/picketai/picket"
repo_name = "picketai/picket"
nav = [
  { "Get started" = [{ "Get started" = "index.md" }, { "Configure your project" = "configure-your-project.md" }, { "Customization" = "customization.md" }, { "How to upgrade" = "upgrade.md" }, { "How to uninstall" = "uninstall.md" }, { "Platform support" = "platform-support.md" }] },
  { "How to use Picket" = "how-to.md" },
  { "Reference" = [{ "Agents" = "reference/agents.md" }, { "Skills" = "reference/skills.md" }, { "Commands" = "reference/cli.md" }, { "Hooks" = "reference/hooks.md" }, { "Mods" = "reference/mods.md" }] },
]
not_in_nav = "style-checklist.md"
extra_css = ["stylesheets/picketai.css"]

[project.theme]
custom_dir = "docs-theme"
language = "en"
features = ["navigation.tabs", "navigation.sections", "navigation.path", "navigation.footer", "navigation.top", "search.highlight", "content.code.copy"]

[project.theme.font]
text = "IBM Plex Sans"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
