[project]
site_name = "Picket"
site_description = "A software-development workflow for Claude Code: four lanes, five agents, one kernel."
site_url = "https://picketai.github.io/picket/"
repo_url = "https://github.com/picketai/picket"
repo_name = "picketai/picket"
nav = [
  { "Get started" = [{ "Get started" = "index.md" }, { "Configure your project" = "configure-your-project.md" }, { "Set up testing" = "set-up-testing.md" }, { "How to upgrade" = "upgrade.md" }, { "How to uninstall" = "uninstall.md" }, { "Platform support" = "platform-support.md" }, { "Changelog" = "https://github.com/picketai/picket/blob/trunk/CHANGELOG.md" }] },
  { "Usage" = [{ "Your first change" = "first-change.md" }, { "How Picket works" = "how-it-works.md" }, { "The daily loop" = "how-to.md" }, { "Adopt in an existing codebase" = "adopting.md" }, { "Troubleshooting" = "troubleshooting.md" }] },
  { "Settings" = [{ "Settings and extensions" = "customization.md" }, { "Look and notifications" = "look.md" }] },
  { "Learn more" = [{ "Lanes" = [{ "The four lanes" = "lanes/index.md" }, { "Fast" = "lanes/fast.md" }, { "Order" = "lanes/order.md" }, { "Design" = "lanes/design.md" }, { "Research" = "lanes/research.md" }] }, { "The flow in detail" = [{ "Gates and replies" = "gates.md" }, { "Review and testing" = "review-and-testing.md" }, { "Worktrees in an umbrella" = "umbrella-worktrees.md" }] }, { "Reference" = [{ "Agents" = "reference/agents.md" }, { "Skills" = "reference/skills.md" }, { "Commands" = "reference/cli.md" }, { "Hooks" = "reference/hooks.md" }, { "Mods" = "reference/mods.md" }] }, { "Background" = [{ "Glossary" = "glossary.md" }, { "How Picket compares" = "comparison.md" }] }] },
]
extra_css = ["stylesheets/picketai.css", "stylesheets/layout.css"]
extra_javascript = ["javascripts/diagram-fullscreen.js"]

[project.theme]
custom_dir = "docs-theme"
language = "en"
favicon = "images/favicon.png"
features = ["navigation.tabs", "navigation.sections", "navigation.path", "navigation.footer", "navigation.top", "search.highlight", "content.code.copy"]

[project.theme.font]
text = "IBM Plex Sans"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
